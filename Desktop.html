html,body{margin:0;padding:0;}
.ad{position:relative;width:728px;height:90px;overflow:hidden;background:#fff;font-family:'Outfit',Arial,sans-serif;cursor:pointer;-webkit-font-smoothing:antialiased;}
.s{position:absolute;inset:0;opacity:0;pointer-events:none;overflow:hidden;transition:opacity .5s ease;}
.s.on{opacity:1;pointer-events:auto;}
/* ---- wavy light panels ---- */
.light{background:linear-gradient(180deg,#ffffff 0%,#f4f8f5 100%);}
.sky{position:absolute;left:0;top:0;height:90px;fill:#106D39;}
.sky.back{opacity:.075;animation:drift 46s linear infinite;}
.sky.front{opacity:.14;animation:drift 26s linear infinite;}
.s3 .sky.back{animation-duration:54s;animation-direction:reverse;}
.s3 .sky.front{animation-duration:32s;animation-direction:reverse;}
@keyframes drift{from{transform:translateX(0);}to{transform:translateX(-728px);}}
/* ---- slide 1 ---- */
.s1 .row{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:24px;}
.s1 .mark{height:41px;display:block;}
.s1 .lw{opacity:0;transform:scale(.6);}
